<div class="car-accessories container">

  <!-- Header -->
  <div class="header text-center mb-4">

    <h2>Car Accessories</h2>

    <div class="categories mt-3">
      <button
        class="btn btn-outline-dark me-2 mb-2"
        *ngFor="let cat of categories"
        (click)="filterProducts(cat)"
        [class.active]="selectedCategory === cat"
      >
        {{cat}}
      </button>
      <br><br>
  
    <button class="btn btn-dark px-4" (click)="viewAll()">
      View All
    </button><br>
  
    </div>

  </div>


  <!-- Products -->
  <div class="row">

    <div class="col-xl-3 col-lg-4 col-md-6 col-12 mb-4"
         *ngFor="let product of filteredProducts">

      <div class="product-card">

        <!-- Top Discount -->
        <div class="top-discount">
          {{product.discount}} OFF
        </div>

        <!-- Image -->
        <div class="image-box">
          <img [src]="product.image" class="img-fluid">
        </div>

        <!-- Category Ribbon -->
        <div class="category-ribbon">
          {{product.category}}
        </div>

        <!-- Product Content -->
        <div class="product-content">

          <h5 class="product-title">
            {{product.name}}
          </h5>

          <p class="product-desc">
            {{product.desc}}
          </p>

          <!-- Price -->
          <div class="price-row">

            <div>
              <span class="new-price">₹{{product.price}}</span>
              <span class="old-price">₹{{product.oldPrice}}</span>
            </div>

            <div class="discount-circle">
              {{product.discount}} OFF
            </div>

          </div>

          <!-- EMI -->
          <!-- <p class="emi-text">
            or Rs. {{product.emi}} /Month 🌍
            <span class="emi-link">Buy on EMI ></span>
          </p> -->

          <!-- Button -->
          <button class="btn cart-btn w-100">
            ADD TO CART
          </button>

        </div>

      </div>

    </div>

  </div>


  

</div>
