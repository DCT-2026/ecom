<div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-inner">

        <div class="carousel-item" *ngFor="let slide of slides; let i = index" [class.active]="i === 0">

            <div class="hero-banner" [style.background-image]="'url(' + slide.image + ')'">

                <div class="container banner-content">

                    <h1>{{slide.title}}</h1>

                    <p class="subtitle">{{slide.subtitle}}</p>

                    <div class="price-box">

                        <span class="price">{{slide.price}}</span>

                        <span class="old-price">{{slide.oldPrice}}</span>

                        <button class="shop-btn">Shop Now</button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>
